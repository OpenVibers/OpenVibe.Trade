## ═══════════════════════════════════════════════════════════════
## openvibe.trade — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.trade.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4860, systemd unit openvibe-trade) renders every page;
## nginx terminates TLS, redirects www → apex, rate-limits auth, private forms and API, and
## compresses text.
##
## No proxy_cache here on purpose: the app decides cacheability per response (Cache-Control
## public only for instrument pages and lists shown to anonymous visitors; private, no-store for
## watchlists, alerts, the editor, signed-in views and the API; Vary: Cookie, Authorization). A
## cache added in front must honour those headers — watchlists must never be stored by it.
##
## /internal/ (the signed OpenVibe.Events webhook) is not proxied: Events on this host delivers to
## http://127.0.0.1:4860/internal/events directly.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovtrade_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ovtrade_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovtrade_write:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.trade www.openvibe.trade;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.trade$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.trade;

    ssl_certificate     /etc/letsencrypt/live/openvibe.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.trade/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.trade$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.trade;

    ssl_certificate     /etc/letsencrypt/live/openvibe.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.trade/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.trade.access.log;
    error_log  /var/log/nginx/openvibe.trade.error.log;

    # Forms are URL-encoded and small; JSON bodies are at most 512 KB. No uploads.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/feed+json image/svg+xml text/plain application/xml text/xml application/rss+xml application/atom+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints (strict) ──────────────
    location /auth/ {
        limit_req zone=ovtrade_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4860;
    }

    # ── Private forms: watchlists, alerts, the editor ───────
    location ~ ^/(watchlists|alerts|editor)(/|$) {
        limit_req zone=ovtrade_write burst=20 nodelay;
        proxy_pass http://127.0.0.1:4860;
    }

    # ── Signed Events webhook: host-local only ──────────────
    location /internal/ { return 404; }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovtrade_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:4860;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4860/metrics) ──
    location = /metrics { return 404; }

    # ── Pages, JSON twins, feeds, sitemaps, robots.txt, llms.txt, static assets ──
    location / {
        proxy_pass http://127.0.0.1:4860;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
